name: noor
description: "Noor: a video and audio player for Android and Windows that downloads or streams links from YouTube, TikTok, Facebook and X."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  # Not imported: bundles the native libmpv the player needs at runtime.
  media_kit_libs_video: ^1.0.7
  file_picker: ^13.1.0
  go_router: ^18.1.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  crypto: ^3.0.7
  path: ^1.9.1
  window_manager: ^0.5.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Regenerates the Android launcher icons: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#211044"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
